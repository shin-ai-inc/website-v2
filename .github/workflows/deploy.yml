# main へ push されたら、組み立て → 全検査 → Cloudflare Workers へ配信する。
# 検査が赤なら配信しない(配信の入口はここ一つ。手元からの wrangler deploy は緊急時だけ)。
# 要る秘密: CLOUDFLARE_API_TOKEN(Workers Scripts:Edit の権限だけ)・CLOUDFLARE_ACCOUNT_ID。
# 無い間はこの手順は失敗し、配信は手元から行う。
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 組み立て
        run: node _build/build.mjs
      - name: 全検査
        run: node --test tests/*.test.mjs
      - name: 配信
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
