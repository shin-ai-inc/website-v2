<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.trycloudflare.com https://*.shinai-inc.jp; frame-src https://*.trycloudflare.com https://*.shinai-inc.jp; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>AI ライブ接客の検証ページ｜シンアイ</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif; color: #1f2933; background: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .note { font-size: 14px; color: #52606d; margin: 0 0 16px; }
  .product { border: 1px solid #e4e7eb; border-radius: 12px; padding: 16px; margin: 0 0 20px; }
  .product h2 { font-size: 18px; margin: 0 0 6px; }
  .product p { margin: 0; font-size: 14px; color: #52606d; }
  .missing { padding: 12px 16px; border-radius: 10px; background: #fff4e5; color: #7a4b00; font-size: 14px; }
  code { background: #f1f4f8; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>AI ライブ接客の検証ページ</h1>
  <p class="note">社内の検証用のページです。検索には載せていません。商品と価格は模擬のもので、実際には販売していません。</p>
  <section class="product" id="product" hidden>
    <h2 id="product-title">商品のページ（検証用）</h2>
    <p>配信の「商品のページを見る」から、このページに戻ってきます。実際の EC サイトでは、ここが本物の商品のページになります。</p>
  </section>
  <div id="embed-slot"></div>
  <p id="missing" class="missing" hidden>配信のサーバーの住所が指定されていません。検証では、住所の後ろに <code>?server=https://…</code> を付けて開きます。</p>
</main>
<script src="/lab/avatar-live/page.js"></script>
</body>
</html>
