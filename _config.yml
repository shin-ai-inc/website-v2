# GitHub Pages(Jekyll)向け。ここに挙げたものは公開サイトへコピーされない。
#
# GitHub Pages はリポジトリの根から配信する。ここに挙げないものは
# すべて https://shinai-inc.jp/<パス> で読める。2026-09-11 に api/index.mjs・
# api/lib/guard.mjs・api/wrangler.toml・tests/ が本番で 200 を返していた
# (防御ロジックと内部識別子の露出)。公開してよいものは tests/publish.test.mjs
# の PUBLIC に列挙してあり、追跡ファイルが増えたときに片方だけ直すと
# テストが落ちる。

# Jekyllはドット始まりのディレクトリを既定で除外するため、明示的に戻す。
# これがないと security.txt(RFC 9116)が404になる。
include:
  - .well-known

exclude:
  # 設計・生成の元(公開物はここから生成される)
  - README.md
  - partials
  - deploy
  - _build
  - styles/tokens.css
  - styles/base.css
  - styles/sections
  # サーバー側(Cloudflare Worker)の実装・設定。鍵は含まないが、
  # 防御の中身と内部識別子を相手に渡さない
  - api
  # 検証・開発ツール
  - tests
  - tools
  # 他ホスティング向けの設定
  - netlify.toml
  - .vercelignore
  - .gitattributes
  - Gemfile
  - Gemfile.lock
  - node_modules
