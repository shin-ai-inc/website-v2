# GitHub Pages(Jekyll)向け。ここに挙げたものは公開サイトへコピーされない。

# Jekyllはドット始まりのディレクトリを既定で除外するため、明示的に戻す。
# これがないと security.txt(RFC 9116)が404になる。
include:
  - .well-known

exclude:
  - README.md
  - partials
  - deploy
  - _build
  - styles/tokens.css
  - styles/base.css
  - styles/sections
  - Gemfile
  - Gemfile.lock
