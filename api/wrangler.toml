# ShinAI サポートAI — Cloudflare Worker 設定
#
# デプロイ:
#   1) node _build/build.mjs        知識ベースを生成し api/ へ配置する
#   2) cd api && npx wrangler deploy
#
# 秘密は絶対にここへ書かない。投入は次のコマンドのみ:
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put IP_SALT             32文字以上のランダム文字列。未設定だと IP 単位の統制が「止める側」に倒れ、
#                                               チャットと問い合わせが定型応答(busy)になる(公開の既定値は持たない)
#   npx wrangler secret put TURNSTILE_SECRET    人間確認の秘密鍵。未設定だと問い合わせは受理せず控え(D1)へ落ちる
#   npx wrangler secret put SLACK_WEBHOOK_URL   お客様の声・問い合わせ送信失敗の通知先
#   npx wrangler secret put ADMIN_TOKEN         記録の閲覧に使う鍵(32文字以上)
#   npx wrangler secret put RESEND_API_KEY      問い合わせフォームのメール送信(Resend)
#
# 記録用テーブルの作成(一度だけ。追加後の再実行も安全・CREATE TABLE IF NOT EXISTS):
#   npx wrangler d1 execute shinai-voices --remote --file=schema.sql

name = "shinai-chat"
main = "index.mjs"
compatibility_date = "2026-08-01"

# 既定の *.workers.dev ルートを無効化する。
# このゾーンはWAF・レート制限が適用されないため、開けたままだと
# カスタムドメイン側に敷いた統制をすべて迂回されうる。
workers_dev = false

# 版ごとのプレビューURL(*.workers.dev 配下)も切る。workers_dev と同じ理由で、
# カスタムドメイン側の統制を迂回する入口になる。
preview_urls = false

# 公開先。custom_domain にすると、CloudflareがDNSレコード(AAAA)も自動作成する。
# pattern 形式(custom_domain = false)ではルートだけが張られ、DNSは別途手当てが必要になる。
routes = [
  { pattern = "api.shinai-inc.jp", custom_domain = true }
]

[vars]
# 受理するオリジン。ワイルドカードは使わない。
ALLOWED_ORIGINS = "https://shinai-inc.jp,https://www.shinai-inc.jp"
# 想定ホスト。これ以外(workers.dev等)からの到達を拒否する多層防御。
API_HOST = "api.shinai-inc.jp"
# 日次上限。許容月額1,500円(約$10)/30日 ÷ 1件約$0.0004 から導出。
# 検索で根拠を絞る設計にしたことで1件あたりが約8分の1になり、上限を広げられた。
# 再デプロイなしで調整できるよう変数化している。
DAILY_LIMIT = "800"
MODEL = "gpt-4o-mini"
MAX_TOKENS = "400"

# 問い合わせフォーム(/api/contact)。
# CONTACT_FROM_EMAIL は Resend 側でドメイン認証(DKIM/SPF)を済ませたアドレスのみ使える。
# 未設定・RESEND_API_KEY未投入の間は、届いたふりをせず控え(D1)へ落として success:false を返す。
CONTACT_TO_EMAIL = "contact@shinai-inc.jp"
CONTACT_FROM_EMAIL = "ShinAI サイト <noreply@send.shinai-inc.jp>"
# 日次上限。実勢の相談件数を大きく超えつつ、フォーム連投は止められる値。
# 人間確認(Turnstile)の秘密鍵は vars ではなく secret: `npx wrangler secret put TURNSTILE_SECRET`
# 未設定のあいだは受理せず控えへ落とす(contact.mjs turnstileSecretStatus)。サイトキーは scripts/config.js 等に置く。
CONTACT_DAILY_LIMIT = "30"
# 同一IP・同一日の上限。総量(30)を1台に使い切らせない
CONTACT_PER_IP_LIMIT = "3"
# 同一IPが乗っ取りを試みた回数の上限。超えたらその日は定型応答のみ
CHAT_FLAG_LIMIT = "5"
# 同一IP・同一日にチャットの生成へ進める回数の上限。1台の機械に日次総量(800)を
# 使い切らせない。正当な訪問者が1日に40問を超えることは実務上ない。超えたら busy の定型応答
CHAT_PER_IP_LIMIT = "40"

# 日次予算メーター。単一インスタンスで全体を数え、
# IP単位の制限では止まらない低速分散を捕捉する。
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetMeter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetMeter"]

# お客様の声の保管先。保存期間は voices.mjs の RETENTION_DAYS が唯一の定義。
[[d1_databases]]
binding = "VOICES"
database_name = "shinai-voices"
database_id = "6ce50e15-1a9d-4a12-b4e4-2ab9a75231ab"

# 知識ベース(build.mjs が生成)を同梱するための設定。
# 実体は api/knowledge.*.json。ビルドのたびに更新される。
[build]
command = ""
